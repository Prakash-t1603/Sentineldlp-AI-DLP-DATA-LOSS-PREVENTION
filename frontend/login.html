<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SentinelDLP AI Security Operations</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="glass-panel p-4 p-md-5" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3">
        <i class="fas fa-shield-halved"></i>
      </div>
      <h2 class="h4 text-white fw-bold">SentinelDLP AI</h2>
      <p class="small text-muted mb-0">SOC Analyst & Administrator Authentication</p>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills nav-fill mb-4 p-1 rounded-3" style="background: rgba(0,0,0,0.3);">
      <li class="nav-item">
        <button class="nav-link active py-2 text-white" id="tab-login-btn" data-bs-toggle="pill" data-bs-target="#tab-login">
          <i class="fas fa-key me-1"></i> Sign In
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link py-2 text-white" id="tab-reg-btn" data-bs-toggle="pill" data-bs-target="#tab-reg">
          <i class="fas fa-user-plus me-1"></i> Register
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Tab 1: Login Form -->
      <div class="tab-pane fade show active" id="tab-login">
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label small text-muted">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-user"></i></span>
              <input type="text" id="login-identity" class="form-control form-control-dark" placeholder="admin@sentineldlp.io" value="admin@sentineldlp.io" required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small text-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
              <input type="password" id="login-password" class="form-control form-control-dark" placeholder="••••••••" value="Admin@123456" required>
            </div>
          </div>
          <button type="submit" class="btn btn-cyan w-100 py-2 mb-3">
            <i class="fas fa-sign-in-alt me-2"></i> Secure Login
          </button>
        </form>

        <div class="p-3 rounded-3 bg-dark border border-secondary border-opacity-25 small text-muted mt-3">
          <div class="fw-bold text-info mb-1"><i class="fas fa-info-circle me-1"></i> Default System Credentials:</div>
          <div>Admin: <code class="text-white">admin@sentineldlp.io</code> / <code class="text-white">Admin@123456</code></div>
          <div>Analyst: <code class="text-white">analyst@sentineldlp.io</code> / <code class="text-white">Analyst@123456</code></div>
        </div>
      </div>

      <!-- Tab 2: Register Form -->
      <div class="tab-pane fade" id="tab-reg">
        <form id="register-form">
          <div class="mb-3">
            <label class="form-label small text-muted">Username</label>
            <input type="text" id="reg-username" class="form-control form-control-dark" placeholder="analyst_john" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">Corporate Email</label>
            <input type="email" id="reg-email" class="form-control form-control-dark" placeholder="john@enterprise.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">Role</label>
            <select id="reg-role" class="form-select form-control-dark">
              <option value="security_analyst">Security Analyst</option>
              <option value="employee">Employee</option>
              <option value="admin">Administrator</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label small text-muted">Password (min 6 chars)</label>
            <input type="password" id="reg-password" class="form-control form-control-dark" placeholder="••••••••" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-cyan w-100 py-2">
            <i class="fas fa-user-plus me-2"></i> Register Account
          </button>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="/employee-portal" class="text-muted small text-decoration-none hover-white">
        <i class="fas fa-arrow-left me-1"></i> Switch to Employee Endpoint Portal
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
