<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SentinelDLP Browser Agent</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 700;
      color: #38bdf8;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .event-list {
      max-height: 160px;
      overflow-y: auto;
    }
    .event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #334155;
      font-size: 12px;
    }
    .event-item:last-child {
      border-bottom: none;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-block { background: #ef4444; color: #fff; }
    .badge-warn { background: #f59e0b; color: #000; }
    .badge-allow { background: #10b981; color: #fff; }
    .btn-dashboard {
      display: block;
      width: 100%;
      text-align: center;
      padding: 8px;
      background: #0284c7;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      box-sizing: border-box;
    }
    .btn-dashboard:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🛡️ SentinelDLP</div>
    <div id="agent-status" class="status-badge">● Online</div>
  </div>

  <div class="card">
    <div class="card-title">Central DLP Server</div>
    <div style="font-family: monospace; font-size: 11px; color: #38bdf8; word-break: break-all;" id="server-address">
      http://172.24.143.236:8000
    </div>
  </div>

  <div class="card">
    <div class="card-title">Active Protection Channels</div>
    <div style="line-height: 1.5; color: #cbd5e1; font-size: 12px;">
      ☁️ Google Drive, OneDrive, Dropbox<br>
      💬 WhatsApp Web & Chat<br>
      ✉️ Gmail & Outlook Webmail
    </div>
  </div>

  <div class="card">
    <div class="card-title">Recent Intercepted Uploads</div>
    <div id="events-container" class="event-list">
      <div style="color: #64748b; text-align: center; padding: 12px;">No uploads intercepted yet</div>
    </div>
  </div>

  <a href="http://172.24.143.236:8000/dashboard" target="_blank" class="btn-dashboard">
    Open SOC Admin Dashboard (172.24.143.236) ↗
  </a>

  <script src="popup.js"></script>
</body>
</html>
